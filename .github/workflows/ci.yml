name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El contrato es la frontera entre frontend y backend, y no pertenece a ninguno
  # de los dos: por eso se valida en un job propio y no dentro del de un paquete.
  #
  # Existe porque el documento arrastró durante meses sintaxis de OpenAPI 3.0
  # (`nullable`) declarando `openapi: 3.1.0`. El linter ya estaba disponible; lo
  # que faltaba era que alguien lo ejecutara. Los avisos no rompen el build; los
  # errores de estructura sí.
  contrato:
    name: Contrato de API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Lint del contrato OpenAPI
        run: npx --yes @redocly/cli@latest lint contrato-api/openapi.yaml

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --no-watch

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # La suite e2e ejerce la aplicación completa contra PostgreSQL real, con el
    # esquema creado por las migraciones. Sin base de datos en el runner no hay
    # e2e posible — y esa es la razón por la que el paso nació vacío.
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: validalab
          POSTGRES_PASSWORD: validalab
          POSTGRES_DB: validalab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (check, sin --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # La suite crea su propia base `validalab_test` y aplica las migraciones.
      # Sin `--passWithNoTests`: si algún día no hay specs, este paso debe fallar,
      # no aprobar en silencio.
      - name: E2E tests
        run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: validalab
          DB_PASSWORD: validalab
          DB_DATABASE: validalab_test
