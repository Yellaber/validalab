<section class="auth-card">
  <h1>Iniciar sesión</h1>
  <p class="auth-sub">Accede a tu portafolio de ideas en ValidaLab.</p>

  <form (submit)="onSubmit(); $event.preventDefault()">
    @if (errorGeneral(); as error) {
      <p class="auth-error" role="alert">{{ error }}</p>
    }

    <label class="campo">
      <span>Email</span>
      <input type="email" autocomplete="email" [formField]="formulario.email" />
      @if (formulario.email().touched() && formulario.email().errors().length) {
        <small class="campo-error">{{ formulario.email().errors()[0].message }}</small>
      }
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <input type="password" autocomplete="current-password" [formField]="formulario.password" />
      @if (formulario.password().touched() && formulario.password().errors().length) {
        <small class="campo-error">{{ formulario.password().errors()[0].message }}</small>
      }
    </label>

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="auth-alt">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</section>
